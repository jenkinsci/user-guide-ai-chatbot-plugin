services:
  postgres_db:
    image: postgres:16-alpine
    restart: unless-stopped
    container_name: postgres_db_e2e_test
    ports:
      - "5432:5432"
    env_file:
      - ./e2e/.env.e2e
    volumes:
      - ./e2e/postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant_db:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    container_name: qdrant_db_e2e_test
    ports:
      - 6333:6333
      - 6334:6334
    expose:
      - 6333
      - 6334
      - 6335
    env_file:
      - ./e2e/.env.e2e
    environment:
      QDRANT__SERVICE__JWT_RBAC: "true"
    volumes:
      - ./e2e/qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/127.0.0.1/6333"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend_api:
    container_name: backend_e2e_test
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./e2e/.env.e2e
    depends_on:
      postgres_db:
        condition: service_healthy
      qdrant_db:
        condition: service_healthy
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 10s
      retries: 10

  jenkins_app:
    container_name: jenkins_app_e2e_test
    build:
      context: .
      dockerfile: jenkins/Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - ./e2e/.env.e2e
    environment:
      - CASC_JENKINS_CONFIG=/var/jenkins_home/casc.yaml
    volumes:
      - ./jenkins/casc.yaml:/var/jenkins_home/casc.yaml
    depends_on:
      backend_api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sSf", "http://localhost:8080/"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      default:
        aliases:
          - jenkins.local

  e2e_runner:
    image: cypress/included:latest
    environment:
      - CYPRESS_baseUrl=http://jenkins.local:8080
    working_dir: /e2e
    volumes:
      - ./e2e:/e2e
    depends_on:
      jenkins_app:
        condition: service_healthy
