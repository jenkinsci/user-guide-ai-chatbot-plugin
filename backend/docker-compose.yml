services:
  postgres_db:
    image: postgres:16-alpine
    restart: unless-stopped
    container_name: postgres_db
    ports:
      - "5432:5432"
    env_file:
      - ${ENV_FILE:-.env}
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant_db:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    container_name: qdrant_db
    ports:
      - 6333:6333
      - 6334:6334
    expose:
      - 6333
      - 6334
      - 6335
    env_file:
      - ${ENV_FILE:-.env}
    volumes:
      - ./qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/127.0.0.1/6333"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: fastapi_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ${ENV_FILE:-.env}
    profiles:
      - prod
    depends_on:
      postgres_db:
        condition: service_healthy
      qdrant_db:
        condition: service_healthy
