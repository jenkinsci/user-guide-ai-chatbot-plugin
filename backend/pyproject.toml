[project]
name = "backend"
version = "0.1.0"
description = "AI Chatbot to Guide User Workflow"
readme = "README.md"
authors = [
    { name = "Jenkins Community" }
]
requires-python = ">=3.12"
dependencies = [
    "aiohttp",
    "asyncpg",
    "babel",
    "beautifulsoup4",
    "cachetools",
    "deepeval==4.1.10",
    "fastapi",
    "langchain",
    "langchain-anthropic",
    "langchain-classic",
    "langchain-community",
    "langchain-core",
    "langchain-groq",
    "langchain-huggingface",
    "langchain-ollama",
    "langchain-openai",
    "langchain-protocol",
    "langchain-qdrant",
    "langchain-text-splitters",
    "langgraph",
    "langgraph-checkpoint",
    "langgraph-checkpoint-postgres",
    "langsmith",
    "lxml>=6.1.1",
    "psycopg[binary]",
    "psycopg-pool",
    "pyjwt>=2.13.0",
    "python-dotenv",
    "python-jose[cryptography]>=3.5.0",
    "requests",
    "sphinx",
    "sqlalchemy",
    "urllib3",
    "uvicorn",
    "openai>=2.45.0",
    "sentence-transformers>=5.7.0",
    "fastembed>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
dev = [
    "black==26.5.1",
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
